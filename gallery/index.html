<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gallery — TLR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:"Courier New",monospace;}
canvas{display:block;}
.back{position:fixed;top:20px;left:20px;z-index:2;color:#888;text-decoration:none;font-size:13px;letter-spacing:1px;transition:color 0.2s;}
.back:hover{color:#fff;}
.hint{position:fixed;bottom:20px;left:20px;z-index:2;color:#444;font-size:11px;letter-spacing:1px;}
.empty-notice{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;color:#555;font-size:12px;letter-spacing:1px;text-align:center;display:none;}
.empty-notice.show{display:block;}
</style>
</head>
<body>
<a class="back" href="../index.html">&larr; back</a>
<div class="hint">drag to rotate · scroll to zoom</div>
<div class="empty-notice" id="empty-notice">[ no photos yet — add files to gallery/photos/ and list them in gallery/index.html ]</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const PARTICLE_COUNT = 1500;
const PARTICLE_SIZE_MIN = 0.005;
const PARTICLE_SIZE_MAX = 0.010;
const SPHERE_RADIUS = 9;
const POSITION_RANDOMNESS = 4;
const ROTATION_SPEED_Y = 0.0005;
const PARTICLE_OPACITY = 1;
const IMAGE_SIZE = 1.5;

// Add your photo filenames here — place the actual files in gallery/photos/
const PHOTOS = [
  'photos/363BE6CD-D052-4266-BE36-D1FD9590DD67_1_105_c.jpeg',
  'photos/LOU00167.JPG',
  'photos/LOU00215.JPG',
  'photos/LOU00219.JPG',
  'photos/LOU00236.JPG',
  'photos/LOU00243.JPG',
  'photos/LOU00246.JPG',
  'photos/LOU00248.JPG',
  'photos/LOU00259.JPG',
];

if(!PHOTOS.length) document.getElementById('empty-notice').classList.add('show');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(-10, 1.5, 10);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const pointLight = new THREE.PointLight(0xffffff, 1);
pointLight.position.set(10, 10, 10);
scene.add(pointLight);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enablePan = true;
controls.enableZoom = true;
controls.enableRotate = true;
controls.enableDamping = true;
controls.dampingFactor = 0.05;

const group = new THREE.Group();
scene.add(group);

// Particle sphere — Fibonacci point distribution, rendered as a single
// InstancedMesh (1 draw call instead of 1500 individual meshes)
const particleGeometry = new THREE.SphereGeometry(1, 8, 6);
const particleMaterial = new THREE.MeshBasicMaterial({ transparent: true, opacity: PARTICLE_OPACITY, vertexColors: true });
const particles = new THREE.InstancedMesh(particleGeometry, particleMaterial, PARTICLE_COUNT);
const dummy = new THREE.Object3D();

for(let i = 0; i < PARTICLE_COUNT; i++){
  const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
  const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
  const r = SPHERE_RADIUS + (Math.random() - 0.5) * POSITION_RANDOMNESS;

  const x = r * Math.cos(theta) * Math.sin(phi);
  const y = r * Math.cos(phi);
  const z = r * Math.sin(theta) * Math.sin(phi);

  const scale = Math.random() * (PARTICLE_SIZE_MAX - PARTICLE_SIZE_MIN) + PARTICLE_SIZE_MIN;
  const color = new THREE.Color().setHSL(Math.random() * 0.1 + 0.05, 0.8, 0.6 + Math.random() * 0.3);

  dummy.position.set(x, y, z);
  dummy.scale.setScalar(scale);
  dummy.updateMatrix();
  particles.setMatrixAt(i, dummy.matrix);
  particles.setColorAt(i, color);
}
particles.instanceMatrix.needsUpdate = true;
if(particles.instanceColor) particles.instanceColor.needsUpdate = true;
group.add(particles);

// Orbiting photo planes, evenly spaced around the sphere's equator
if(PHOTOS.length){
  const loader = new THREE.TextureLoader();
  const center = new THREE.Vector3(0, 0, 0);
  const up = new THREE.Vector3(0, 1, 0);
  const matrix = new THREE.Matrix4();
  const euler = new THREE.Euler();

  PHOTOS.forEach((src, i) => {
    const angle = (i / PHOTOS.length) * Math.PI * 2;
    const x = SPHERE_RADIUS * Math.cos(angle);
    const y = 0;
    const z = SPHERE_RADIUS * Math.sin(angle);

    const position = new THREE.Vector3(x, y, z);
    const outward = position.clone().sub(center).normalize();
    matrix.lookAt(position, position.clone().add(outward), up);
    euler.setFromRotationMatrix(matrix);
    euler.z += Math.PI;

    const texture = loader.load(src);
    texture.wrapS = THREE.ClampToEdgeWrapping;
    texture.wrapT = THREE.ClampToEdgeWrapping;
    texture.flipY = false;
    texture.colorSpace = THREE.SRGBColorSpace;

    const geometry = new THREE.PlaneGeometry(IMAGE_SIZE, IMAGE_SIZE);
    const material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(x, y, z);
    mesh.rotation.set(euler.x, euler.y, euler.z);
    group.add(mesh);
  });
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  group.rotation.y += ROTATION_SPEED_Y;
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
