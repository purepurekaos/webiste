<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Louis</title>
<style>
@font-face{
  font-family:"Endless";
  src:url("fonts/Endless-Regular.ttf") format("truetype");
  font-weight:400;
  font-style:normal;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#fff;height:100%;overflow:hidden;}
body{cursor:crosshair;}
.box{
  width:80px;height:34px;
  display:flex;align-items:center;justify-content:center;
  background:#e3ff3a;
  border:2px solid #fff;
  border-radius:5px;
  box-shadow:0 3px 8px rgba(0,0,0,0.18);
  font:400 14px/1 "Endless","Helvetica Neue",Arial,sans-serif;
  color:#111;
}
.tag{
  position:fixed;
  pointer-events:none;
  opacity:0;
  animation:pop-in 0.45s cubic-bezier(.2,.9,.3,1) forwards;
  transition:opacity 0.5s ease, transform 0.5s ease;
}
.choice{
  position:fixed;
  cursor:pointer;
  z-index:10;
  user-select:none;
  transition:left 0.45s cubic-bezier(.3,.8,.2,1), top 0.45s cubic-bezier(.3,.8,.2,1);
}
.tag.fade{
  opacity:0;
  transform:translate(-50%,-50%) scale(0.6) rotate(var(--rot));
}
@keyframes pop-in{
  0%{opacity:0;transform:translate(-50%,-50%) scale(0.2) rotate(var(--rot0));}
  60%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(calc(var(--rot) + 6deg));}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(var(--rot));}
}
.hint{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);font:14px/1 "Endless","Helvetica Neue",Arial,sans-serif;color:#999;letter-spacing:0.5px;pointer-events:none;transition:opacity 0.3s ease;}
.transition-layer{position:fixed;inset:0;pointer-events:none;z-index:50;}
.path-tag{
  position:fixed;top:0;left:0;
  width:22px;height:22px;
  font-size:13px;
  opacity:0;
  offset-distance:0%;
  offset-rotate:0deg;
  transition:offset-distance 2.1s cubic-bezier(.3,.7,.2,1), opacity 0.35s ease;
  will-change:offset-distance;
}
.path-tag.run{opacity:1;}
.path-tag.leave{opacity:0;}
.fade-out{opacity:0 !important;transition:opacity 0.25s ease;}
</style>
</head>
<body>
<div id="yes-box" class="box choice">yes</div>
<div id="no-box" class="box choice">no</div>
<div class="hint">move your mouse</div>
<script>
const MIN_DIST = 26;
const MAX_TAGS = 70;
const FADE_AFTER = 2200;

let lastX = null, lastY = null, count = 0;
let transitionActive = false;
const tags = [];

function removeTag(tag){
  tag.classList.add('fade');
  setTimeout(() => {
    tag.remove();
    const idx = tags.indexOf(tag);
    if(idx !== -1) tags.splice(idx, 1);
  }, 500);
}

function spawnTag(x, y, angleDeg){
  const tag = document.createElement('div');
  tag.className = 'box tag';
  tag.textContent = count % 2 === 0 ? 'Louis' : 'Employ';
  count++;
  const jitter = Math.random() * 14 - 7;
  tag.style.left = x + 'px';
  tag.style.top = y + 'px';
  tag.style.setProperty('--rot', (angleDeg + jitter) + 'deg');
  tag.style.setProperty('--rot0', (angleDeg + Math.random() * 60 - 30) + 'deg');
  document.body.appendChild(tag);
  tags.push(tag);

  setTimeout(() => removeTag(tag), FADE_AFTER);
  if(tags.length > MAX_TAGS) removeTag(tags[0]);
}

function handleMove(x, y){
  if(transitionActive) return;
  if(lastX === null){
    lastX = x; lastY = y;
    spawnTag(x, y, 0);
    return;
  }
  const dx = x - lastX, dy = y - lastY;
  const dist = Math.hypot(dx, dy);
  if(dist >= MIN_DIST){
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    spawnTag(x, y, angle);
    lastX = x; lastY = y;
  }
}

// Yes/No boxes: start centered side by side, dodge the cursor
const yesBox = document.getElementById('yes-box');
const noBox = document.getElementById('no-box');

// Invisible quiet zone around each button: no trail spawns this close,
// so the effect doesn't fight the user while they're aiming for it.
const QUIET_MARGIN = 50;
function inQuietZone(x, y){
  for(const box of [yesBox, noBox]){
    const r = box.getBoundingClientRect();
    if(x >= r.left - QUIET_MARGIN && x <= r.right + QUIET_MARGIN &&
       y >= r.top - QUIET_MARGIN && y <= r.bottom + QUIET_MARGIN){
      return true;
    }
  }
  return false;
}

window.addEventListener('pointermove', e => {
  if(!inQuietZone(e.clientX, e.clientY)) handleMove(e.clientX, e.clientY);
});
const BOX_W = 80, BOX_H = 34, GAP = 12, EDGE_MARGIN = 20;
const AVOID_RADIUS = 130;
const DODGE_COOLDOWN = 350;
let lastDodge = { yes: 0, no: 0 };

function placeSideBySide(){
  const totalW = BOX_W * 2 + GAP;
  const startX = (window.innerWidth - totalW) / 2;
  const y = (window.innerHeight - BOX_H) / 2;
  yesBox.style.left = startX + 'px';
  yesBox.style.top = y + 'px';
  noBox.style.left = (startX + BOX_W + GAP) + 'px';
  noBox.style.top = y + 'px';
}
placeSideBySide();

function randomPos(){
  const x = EDGE_MARGIN + Math.random() * (window.innerWidth - BOX_W - EDGE_MARGIN * 2);
  const y = EDGE_MARGIN + Math.random() * (window.innerHeight - BOX_H - EDGE_MARGIN * 2);
  return { x, y };
}

function maybeDodge(box, key, mouseX, mouseY){
  if(transitionActive) return;
  const rect = box.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const dist = Math.hypot(mouseX - cx, mouseY - cy);
  const now = performance.now();
  if(dist < AVOID_RADIUS && now - lastDodge[key] > DODGE_COOLDOWN){
    lastDodge[key] = now;
    const pos = randomPos();
    box.style.left = pos.x + 'px';
    box.style.top = pos.y + 'px';
  }
}

window.addEventListener('pointermove', e => {
  maybeDodge(noBox, 'no', e.clientX, e.clientY);
});

function dodgeNow(){
  lastDodge.no = performance.now();
  const pos = randomPos();
  noBox.style.left = pos.x + 'px';
  noBox.style.top = pos.y + 'px';
}

// Safety net: if a click/tap ever lands on it anyway, it still runs away.
noBox.addEventListener('pointerdown', e => {
  e.preventDefault();
  dodgeNow();
});
noBox.addEventListener('click', e => {
  e.preventDefault();
  dodgeNow();
});

// Yes transition: a compact wave of ascii characters races off along a curvy path, then we navigate.
const WAVE_CHARS = ['~', '^', '-', 'v', '.', '*', '+', 'o'];
const TAG_COUNT = 20;
const TAG_STAGGER = 40;
const TAG_TRAVEL = 2100;

function buildTravelPath(){
  const w = window.innerWidth, h = window.innerHeight;
  return `M -60 ${h * 0.55} C ${w * 0.18} ${h * 0.05}, ${w * 0.32} ${h * 0.95}, ${w * 0.5} ${h * 0.5} S ${w * 0.86} ${h * 0.05}, ${w + 60} ${h * 0.6}`;
}

function playYesTransition(){
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduceMotion){
    window.location.href = 'hello.html';
    return;
  }

  // Stop all mouse-cursor animations: no more trail spawns or dodging, and
  // fade out whatever trail tags are already on screen.
  transitionActive = true;
  tags.slice().forEach(removeTag);

  yesBox.classList.add('fade-out');
  noBox.classList.add('fade-out');
  document.querySelector('.hint').classList.add('fade-out');

  const d = buildTravelPath();
  const layer = document.createElement('div');
  layer.className = 'transition-layer';
  document.body.appendChild(layer);

  for(let i = 0; i < TAG_COUNT; i++){
    const tag = document.createElement('div');
    tag.className = 'box path-tag';
    tag.textContent = WAVE_CHARS[i % WAVE_CHARS.length];
    tag.style.offsetPath = `path('${d}')`;
    layer.appendChild(tag);

    setTimeout(() => {
      tag.classList.add('run');
      tag.style.offsetDistance = '100%';
      setTimeout(() => tag.classList.add('leave'), TAG_TRAVEL - 250);
    }, i * TAG_STAGGER);
  }

  const total = TAG_TRAVEL + TAG_COUNT * TAG_STAGGER;
  setTimeout(() => {
    window.location.href = 'hello.html';
  }, total);
}

yesBox.addEventListener('click', playYesTransition);
</script>
</body>
</html>
