<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Louis</title>
<style>
@font-face{
  font-family:"Endless";
  src:url("fonts/Endless-Regular.ttf") format("truetype");
  font-weight:400;
  font-style:normal;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#fff;height:100%;overflow:hidden;}
body{cursor:crosshair;}
.box{
  width:80px;height:34px;
  display:flex;align-items:center;justify-content:center;
  background:#e3ff3a;
  border:2px solid #fff;
  border-radius:5px;
  box-shadow:0 3px 8px rgba(0,0,0,0.18);
  font:400 14px/1 "Endless","Helvetica Neue",Arial,sans-serif;
  color:#111;
}
.tag{
  position:fixed;
  pointer-events:none;
  opacity:0;
  animation:pop-in 0.45s cubic-bezier(.2,.9,.3,1) forwards;
  transition:opacity 0.5s ease, transform 0.5s ease;
}
.nav-tag{
  position:fixed;
  top:28px;
  text-decoration:none;
  cursor:pointer;
  z-index:10;
  transition:transform 0.2s ease;
}
.nav-tag:hover{transform:scale(1.08) rotate(0deg) !important;}
.nav-tag.left{left:28px;transform:rotate(-4deg);}
.nav-tag.right{right:28px;transform:rotate(4deg);}
.tag.fade{
  opacity:0;
  transform:translate(-50%,-50%) scale(0.6) rotate(var(--rot));
}
@keyframes pop-in{
  0%{opacity:0;transform:translate(-50%,-50%) scale(0.2) rotate(var(--rot0));}
  60%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(calc(var(--rot) + 6deg));}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(var(--rot));}
}
.hint{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);font:14px/1 "Endless","Helvetica Neue",Arial,sans-serif;color:#999;letter-spacing:0.5px;pointer-events:none;}
</style>
</head>
<body>
<a href="#projects" class="box nav-tag left">projects</a>
<a href="#contact" class="box nav-tag right">contact</a>
<div class="hint">move your mouse</div>
<script>
const MIN_DIST = 26;
const MAX_TAGS = 70;
const FADE_AFTER = 2200;

let lastX = null, lastY = null, count = 0;
const tags = [];

function removeTag(tag){
  tag.classList.add('fade');
  setTimeout(() => {
    tag.remove();
    const idx = tags.indexOf(tag);
    if(idx !== -1) tags.splice(idx, 1);
  }, 500);
}

function spawnTag(x, y, angleDeg){
  const tag = document.createElement('div');
  tag.className = 'box tag';
  tag.textContent = count % 2 === 0 ? 'Louis' : 'Employ';
  count++;
  const jitter = Math.random() * 14 - 7;
  tag.style.left = x + 'px';
  tag.style.top = y + 'px';
  tag.style.setProperty('--rot', (angleDeg + jitter) + 'deg');
  tag.style.setProperty('--rot0', (angleDeg + Math.random() * 60 - 30) + 'deg');
  document.body.appendChild(tag);
  tags.push(tag);

  setTimeout(() => removeTag(tag), FADE_AFTER);
  if(tags.length > MAX_TAGS) removeTag(tags[0]);
}

function handleMove(x, y){
  if(lastX === null){
    lastX = x; lastY = y;
    spawnTag(x, y, 0);
    return;
  }
  const dx = x - lastX, dy = y - lastY;
  const dist = Math.hypot(dx, dy);
  if(dist >= MIN_DIST){
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    spawnTag(x, y, angle);
    lastX = x; lastY = y;
  }
}

window.addEventListener('pointermove', e => handleMove(e.clientX, e.clientY));
</script>
</body>
</html>
