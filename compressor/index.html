<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>compressor / file compress + decompress</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;color:#fff;font-family:"Courier New",monospace;min-height:100vh;overflow-x:hidden;}
a{color:inherit;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;border-bottom:1px solid #222;}
.topbar .back{color:#888;text-decoration:none;font-size:13px;letter-spacing:1px;transition:color 0.2s;}
.topbar .back:hover{color:#fff;}
.topbar .title{font-size:13px;letter-spacing:2px;color:#666;text-transform:lowercase;}
.layout{display:flex;min-height:calc(100vh - 65px);}
.sidebar{width:300px;flex-shrink:0;border-right:1px solid #222;padding:24px;display:flex;flex-direction:column;gap:20px;overflow-y:auto;max-height:calc(100vh - 65px);}
.main{flex:1;display:flex;flex-direction:column;padding:24px;min-width:0;}

.dropzone{border:1px dashed #333;padding:24px 12px;text-align:center;font-size:11px;letter-spacing:1px;color:#555;cursor:pointer;transition:border-color 0.2s,color 0.2s;}
.dropzone:hover,.dropzone.drag{border-color:#666;color:#999;}
.dropzone input{display:none;}

.field{display:flex;flex-direction:column;gap:6px;}
.field-label{display:flex;justify-content:space-between;font-size:11px;letter-spacing:1px;color:#666;}
select{background:#0a0a0a;border:1px solid #333;color:#ccc;font-family:"Courier New",monospace;font-size:12px;padding:6px 8px;}

.mode-row{display:flex;border:1px solid #333;}
.mode-btn{flex:1;background:none;border:none;color:#666;font-family:"Courier New",monospace;font-size:11px;padding:8px 0;cursor:pointer;letter-spacing:1px;transition:color 0.2s,background 0.2s;}
.mode-btn:not(:last-child){border-right:1px solid #333;}
.mode-btn.active{color:#fff;background:#111;}

.info{font-size:11px;color:#555;line-height:1.7;border-top:1px solid #222;padding-top:14px;}
.info div{display:flex;justify-content:space-between;gap:12px;}
.info .k{color:#555;}
.info .v{color:#999;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px;}

.btn{background:none;border:1px solid #333;color:#888;font-family:"Courier New",monospace;font-size:11px;padding:8px 12px;cursor:pointer;letter-spacing:1px;transition:color 0.2s,border-color 0.2s;}
.btn:hover{color:#fff;border-color:#fff;}
.btn:disabled{opacity:0.3;cursor:default;pointer-events:none;}
.actions{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid #222;padding-top:14px;}

.output-wrap{flex:1;border:1px solid #222;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;position:relative;gap:16px;}
.empty-msg{color:#333;font-size:12px;letter-spacing:1px;}
.result{display:none;flex-direction:column;align-items:center;gap:6px;}
.result.visible{display:flex;}
.result .ratio{font-size:32px;letter-spacing:2px;}
.result .ratio.grew{color:#a55;}
.result .sub{font-size:11px;color:#666;letter-spacing:1px;}
.status{position:absolute;bottom:10px;right:14px;font-size:10px;color:#555;letter-spacing:1px;opacity:0;transition:opacity 0.3s;}
.status.show{opacity:1;}
.error{color:#a55;font-size:11px;letter-spacing:1px;text-align:center;padding:0 20px;}

#fold-overlay{position:fixed;inset:0;z-index:9999;perspective:1600px;pointer-events:none;}
#fold-overlay.active{pointer-events:all;}
.fold-panel{position:absolute;left:0;width:100%;height:50%;background:#000;backface-visibility:hidden;transition:transform 0.6s cubic-bezier(.65,0,.35,1);}
.fold-top{top:0;transform-origin:top center;transform:rotateX(90deg);}
.fold-bottom{bottom:0;transform-origin:bottom center;transform:rotateX(-90deg);}
#fold-overlay.closed .fold-top,#fold-overlay.closed .fold-bottom{transform:rotateX(0deg);}
</style>
</head>
<body>

<div id="fold-overlay" class="active closed"><div class="fold-panel fold-top"></div><div class="fold-panel fold-bottom"></div></div>

<div class="topbar">
  <a class="back" href="../index.html">&larr; back</a>
  <div class="title">file compressor</div>
  <div style="width:60px"></div>
</div>

<div class="layout">
  <div class="sidebar">
    <label class="dropzone" id="dropzone">
      [ drop any file here, or click to browse ]
      <input type="file" id="file-input">
    </label>

    <div class="field">
      <div class="field-label">mode</div>
      <div class="mode-row">
        <button class="mode-btn active" id="mode-compress" data-mode="compress">compress</button>
        <button class="mode-btn" id="mode-decompress" data-mode="decompress">decompress</button>
      </div>
    </div>

    <div class="field">
      <div class="field-label">format</div>
      <select id="format-select">
        <option value="gzip" selected>gzip (.gz)</option>
        <option value="deflate">deflate (.zz)</option>
        <option value="deflate-raw">deflate-raw (.raw)</option>
      </select>
    </div>

    <div class="info" id="info" style="display:none;">
      <div><span class="k">file</span><span class="v" id="info-name">&mdash;</span></div>
      <div><span class="k">input</span><span class="v" id="info-input">&mdash;</span></div>
      <div><span class="k">output</span><span class="v" id="info-output">&mdash;</span></div>
      <div><span class="k">ratio</span><span class="v" id="info-ratio">&mdash;</span></div>
    </div>

    <div class="actions">
      <button class="btn" id="download-btn" disabled>download</button>
      <button class="btn" id="clear-btn" disabled>clear</button>
    </div>
  </div>

  <div class="main">
    <div class="output-wrap" id="output-wrap">
      <div class="empty-msg" id="empty-msg">nothing loaded yet</div>
      <div class="result" id="result">
        <div class="ratio" id="result-ratio">&mdash;</div>
        <div class="sub" id="result-sub">&mdash;</div>
      </div>
      <div class="error" id="error" style="display:none;"></div>
      <div class="status" id="status"></div>
    </div>
  </div>
</div>

<script>
(function(){
  const overlay=document.getElementById('fold-overlay');
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    overlay.classList.remove('active','closed');
    return;
  }
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{overlay.classList.remove('closed');});});
  setTimeout(()=>{overlay.classList.remove('active');},700);
})();

const dropzone=document.getElementById('dropzone');
const fileInput=document.getElementById('file-input');
const formatSelect=document.getElementById('format-select');
const modeCompress=document.getElementById('mode-compress');
const modeDecompress=document.getElementById('mode-decompress');
const info=document.getElementById('info');
const infoName=document.getElementById('info-name');
const infoInput=document.getElementById('info-input');
const infoOutput=document.getElementById('info-output');
const infoRatio=document.getElementById('info-ratio');
const downloadBtn=document.getElementById('download-btn');
const clearBtn=document.getElementById('clear-btn');
const emptyMsg=document.getElementById('empty-msg');
const result=document.getElementById('result');
const resultRatio=document.getElementById('result-ratio');
const resultSub=document.getElementById('result-sub');
const errorEl=document.getElementById('error');
const statusEl=document.getElementById('status');

let mode='compress';
let currentFile=null;
let outputBlob=null;
let outputName='';

const EXT={gzip:'.gz',deflate:'.zz','deflate-raw':'.raw'};

function setMode(m){
  mode=m;
  modeCompress.classList.toggle('active',m==='compress');
  modeDecompress.classList.toggle('active',m==='decompress');
  if(currentFile) processFile(currentFile);
}
modeCompress.addEventListener('click',()=>setMode('compress'));
modeDecompress.addEventListener('click',()=>setMode('decompress'));
formatSelect.addEventListener('change',()=>{if(currentFile) processFile(currentFile);});

function formatBytes(n){
  if(n<1024) return n+' B';
  if(n<1024*1024) return (n/1024).toFixed(1)+' KB';
  return (n/(1024*1024)).toFixed(2)+' MB';
}

function showStatus(msg){
  statusEl.textContent=msg;
  statusEl.classList.toggle('show',!!msg);
}

function showError(msg){
  errorEl.textContent=msg;
  errorEl.style.display='block';
  emptyMsg.style.display='none';
  result.classList.remove('visible');
  downloadBtn.disabled=true;
}

async function processFile(file){
  currentFile=file;
  errorEl.style.display='none';
  outputBlob=null;
  downloadBtn.disabled=true;

  if(typeof CompressionStream==='undefined'||typeof DecompressionStream==='undefined'){
    showError('this browser does not support the Compression Streams API — try a recent Chrome, Edge, Firefox, or Safari 16.4+');
    return;
  }

  showStatus(mode==='compress'?'compressing…':'decompressing…');
  emptyMsg.style.display='none';
  result.classList.remove('visible');

  try{
    const format=formatSelect.value;
    const src=file.stream();
    const transformed=mode==='compress'
      ? src.pipeThrough(new CompressionStream(format))
      : src.pipeThrough(new DecompressionStream(format));
    outputBlob=await new Response(transformed).blob();

    const base=file.name.replace(/\.(gz|zz|raw)$/i,'');
    outputName=mode==='compress' ? base+EXT[format] : (base||'decompressed');

    const inSize=file.size,outSize=outputBlob.size;
    const pct=inSize>0 ? Math.round((1-outSize/inSize)*100) : 0;

    infoName.textContent=file.name;
    infoInput.textContent=formatBytes(inSize);
    infoOutput.textContent=formatBytes(outSize);
    infoRatio.textContent=(pct>=0?pct+'% smaller':(-pct)+'% larger');
    info.style.display='block';

    resultRatio.textContent=mode==='compress'
      ? (pct>=0?pct+'% smaller':(-pct)+'% larger')
      : formatBytes(outSize);
    resultRatio.classList.toggle('grew',mode==='compress'&&pct<0);
    resultSub.textContent=formatBytes(inSize)+' → '+formatBytes(outSize);
    result.classList.add('visible');

    downloadBtn.disabled=false;
    clearBtn.disabled=false;
    showStatus('done');
  }catch(err){
    showError(mode==='decompress'
      ? 'could not decompress — wrong format selected, or file isn\'t '+formatSelect.value+' data'
      : 'compression failed: '+err.message);
    showStatus('');
  }
}

function handleFile(file){
  if(!file) return;
  processFile(file);
}

fileInput.addEventListener('change',e=>{if(e.target.files[0]) handleFile(e.target.files[0]);});
dropzone.addEventListener('dragover',e=>{e.preventDefault();dropzone.classList.add('drag');});
dropzone.addEventListener('dragleave',()=>dropzone.classList.remove('drag'));
dropzone.addEventListener('drop',e=>{
  e.preventDefault();
  dropzone.classList.remove('drag');
  if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

downloadBtn.addEventListener('click',()=>{
  if(!outputBlob) return;
  const url=URL.createObjectURL(outputBlob);
  const a=document.createElement('a');
  a.href=url;a.download=outputName;a.click();
  URL.revokeObjectURL(url);
});

clearBtn.addEventListener('click',()=>{
  currentFile=null;outputBlob=null;
  fileInput.value='';
  info.style.display='none';
  result.classList.remove('visible');
  errorEl.style.display='none';
  emptyMsg.style.display='block';
  downloadBtn.disabled=true;
  clearBtn.disabled=true;
  showStatus('');
});
</script>
</body>
</html>
