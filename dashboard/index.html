<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dashboard — TLR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{color:#fff;font-family:"Courier New",monospace;min-height:100vh;background:#000;padding:40px 20px;}
a{color:#888;}
.wrap{max-width:720px;margin:0 auto;}
.back{display:inline-block;color:#666;text-decoration:none;font-size:12px;letter-spacing:1px;margin-bottom:32px;}
.back:hover{color:#fff;}
h1{font-size:20px;letter-spacing:3px;text-transform:lowercase;margin-bottom:8px;}
.sub{font-size:12px;color:#555;letter-spacing:1px;margin-bottom:36px;}

/* login */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.login-box{pointer-events:auto;width:100%;max-width:320px;padding:0 20px;text-align:center;}
#login input{width:100%;background:#0a0a0a;border:1px solid #333;color:#ccc;font-family:"Courier New",monospace;font-size:13px;padding:10px 12px;letter-spacing:1px;margin-bottom:10px;}
#login input:focus{outline:none;border-color:#666;}
#login button{width:100%;background:none;border:1px solid #333;color:#888;font-family:"Courier New",monospace;font-size:12px;padding:10px 12px;cursor:pointer;letter-spacing:1px;transition:color 0.2s,border-color 0.2s;}
#login button:hover{color:#fff;border-color:#fff;}
#login .error{display:none;color:#a55;font-size:11px;margin-top:10px;letter-spacing:1px;}
#login .error.show{display:block;}

/* dashboard */
#dash{display:none;}
#dash.visible{display:block;}
.top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;}
#logout{background:none;border:1px solid #333;color:#666;font-family:"Courier New",monospace;font-size:11px;padding:7px 12px;cursor:pointer;letter-spacing:1px;transition:color 0.2s,border-color 0.2s;}
#logout:hover{color:#fff;border-color:#fff;}

#add-form{border:1px solid #222;padding:20px;margin-bottom:32px;}
.row{display:flex;gap:8px;margin-bottom:8px;}
.row select,.row input{background:#0a0a0a;border:1px solid #333;color:#ccc;font-family:"Courier New",monospace;font-size:12px;padding:8px 10px;letter-spacing:0.5px;}
.row select{flex:0 0 100px;}
.row input{flex:1;}
textarea{width:100%;background:#0a0a0a;border:1px solid #333;color:#ccc;font-family:"Courier New",monospace;font-size:12px;padding:8px 10px;letter-spacing:0.5px;resize:vertical;min-height:60px;margin-bottom:8px;}
textarea:focus,.row input:focus,.row select:focus{outline:none;border-color:#666;}
#add-btn{background:none;border:1px solid #333;color:#888;font-family:"Courier New",monospace;font-size:12px;padding:8px 16px;cursor:pointer;letter-spacing:1px;transition:color 0.2s,border-color 0.2s;}
#add-btn:hover{color:#fff;border-color:#fff;}

#items{display:flex;flex-direction:column;gap:12px;}
.item{border:1px solid #222;padding:16px 18px;}
.item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.item-type{font-size:10px;color:#555;letter-spacing:1px;text-transform:uppercase;border:1px solid #333;padding:2px 6px;display:inline-block;margin-bottom:8px;}
.item-title{font-size:14px;color:#eee;margin-bottom:6px;}
.item-content{font-size:12px;color:#888;line-height:1.6;white-space:pre-wrap;}
.item-url{font-size:12px;word-break:break-all;}
.item-status{font-size:11px;letter-spacing:1px;color:#6a6;}
.item-status.todo{color:#886;}
.item-del{background:none;border:none;color:#444;cursor:pointer;font-family:"Courier New",monospace;font-size:14px;line-height:1;}
.item-del:hover{color:#a55;}
.empty{color:#444;font-size:12px;letter-spacing:1px;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">&larr; back</a>

  <div id="login">
    <div class="login-box">
      <h1>dashboard</h1>
      <div class="sub">enter your credentials to continue</div>
      <input type="email" id="login-email" placeholder="email" autocomplete="username">
      <input type="password" id="login-password" placeholder="password" autocomplete="current-password">
      <button id="login-btn" type="button">log in</button>
      <div class="error" id="login-error">login failed</div>
    </div>
  </div>

  <div id="dash">
    <div class="top-row">
      <h1 style="margin:0;">dashboard</h1>
      <button id="logout">log out</button>
    </div>

    <div id="add-form">
      <div class="row">
        <select id="new-type">
          <option value="note">note</option>
          <option value="link">link</option>
          <option value="task">task</option>
        </select>
        <input type="text" id="new-title" placeholder="title">
      </div>
      <input type="text" id="new-url" placeholder="url (only for links)" style="width:100%;margin-bottom:8px;">
      <textarea id="new-content" placeholder="content / notes (optional)"></textarea>
      <button id="add-btn" type="button">add item</button>
    </div>

    <div id="items"></div>
  </div>
</div>

<script type="module">
// The browser only ever knows this function's URL — the real Supabase
// project URL and anon key live server-side in the Edge Function and are
// never sent to the client.
const API_URL = 'https://nxaspwxttzximjpnwitn.supabase.co/functions/v1/smooth-action';

const loginEl = document.getElementById('login');
const dashEl = document.getElementById('dash');
const loginEmail = document.getElementById('login-email');
const loginPassword = document.getElementById('login-password');
const loginBtn = document.getElementById('login-btn');
const loginError = document.getElementById('login-error');
const logoutBtn = document.getElementById('logout');
const itemsEl = document.getElementById('items');

const SESSION_KEY = 'tlr-dashboard-session';

function getSession(){
  try{ return JSON.parse(localStorage.getItem(SESSION_KEY)); }catch{ return null; }
}
function setSession(session){
  localStorage.setItem(SESSION_KEY, JSON.stringify(session));
}
function clearSession(){
  localStorage.removeItem(SESSION_KEY);
}

async function callApi(action, payload = {}){
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...payload })
  });
  const body = await res.json();
  return { ok: res.ok, status: res.status, body };
}

// Wraps an authenticated call; on a 401 (expired token) it refreshes once
// and retries before giving up.
async function callApiAuthed(action, payload = {}){
  const session = getSession();
  if(!session) return { ok: false, status: 401, body: { error: 'not logged in' } };

  let result = await callApi(action, { ...payload, access_token: session.access_token });
  if(result.status === 401){
    const refreshed = await callApi('refresh', { refresh_token: session.refresh_token });
    if(!refreshed.ok){
      clearSession();
      return refreshed;
    }
    setSession(refreshed.body.session);
    result = await callApi(action, { ...payload, access_token: refreshed.body.session.access_token });
  }
  return result;
}

function showDashboard(){
  loginEl.style.display = 'none';
  dashEl.classList.add('visible');
  loadItems();
}

function showLogin(){
  dashEl.classList.remove('visible');
  loginEl.style.display = '';
}

async function tryLogin(){
  loginError.classList.remove('show');
  const { ok, body } = await callApi('login', {
    email: loginEmail.value,
    password: loginPassword.value
  });
  if(!ok){
    loginError.textContent = body.error || 'login failed';
    loginError.classList.add('show');
    return;
  }
  setSession(body.session);
  showDashboard();
}

loginBtn.addEventListener('click', tryLogin);
[loginEmail, loginPassword].forEach(el => el.addEventListener('keydown', e => {
  if(e.key === 'Enter') tryLogin();
}));

logoutBtn.addEventListener('click', () => {
  clearSession();
  showLogin();
});

function renderItem(item){
  const div = document.createElement('div');
  div.className = 'item';

  const head = document.createElement('div');
  head.className = 'item-head';

  const left = document.createElement('div');
  const typeTag = document.createElement('div');
  typeTag.className = 'item-type';
  typeTag.textContent = item.type;
  left.appendChild(typeTag);

  const title = document.createElement('div');
  title.className = 'item-title';
  title.textContent = item.title;
  left.appendChild(title);

  if(item.url){
    const url = document.createElement('a');
    url.className = 'item-url';
    url.href = item.url;
    url.target = '_blank';
    url.textContent = item.url;
    left.appendChild(url);
  }

  if(item.content){
    const content = document.createElement('div');
    content.className = 'item-content';
    content.textContent = item.content;
    left.appendChild(content);
  }

  if(item.type === 'task' && item.status){
    const status = document.createElement('div');
    status.className = 'item-status' + (item.status === 'todo' ? ' todo' : '');
    status.textContent = item.status;
    left.appendChild(status);
  }

  head.appendChild(left);

  const del = document.createElement('button');
  del.className = 'item-del';
  del.textContent = '✕';
  del.addEventListener('click', () => deleteItem(item.id));
  head.appendChild(del);

  div.appendChild(head);
  return div;
}

async function loadItems(){
  const { ok, body } = await callApiAuthed('list');

  itemsEl.innerHTML = '';
  if(!ok){
    if(body.error === 'not logged in'){ showLogin(); return; }
    itemsEl.innerHTML = `<div class="empty">error loading items: ${body.error}</div>`;
    return;
  }
  if(!body.items.length){
    itemsEl.innerHTML = '<div class="empty">[ no items yet ]</div>';
    return;
  }
  body.items.forEach(item => itemsEl.appendChild(renderItem(item)));
}

async function deleteItem(id){
  await callApiAuthed('delete', { id });
  loadItems();
}

document.getElementById('add-btn').addEventListener('click', async () => {
  const type = document.getElementById('new-type').value;
  const title = document.getElementById('new-title').value.trim();
  const url = document.getElementById('new-url').value.trim();
  const content = document.getElementById('new-content').value.trim();
  if(!title) return;

  await callApiAuthed('add', { item: { type, title, url: url || null, content: content || null } });

  document.getElementById('new-title').value = '';
  document.getElementById('new-url').value = '';
  document.getElementById('new-content').value = '';
  loadItems();
});

// Restore existing session on load
if(getSession()){
  showDashboard();
} else {
  showLogin();
}
</script>
</body>
</html>
